name: Djossi CI Scraper Cron

on:
  schedule:
    # Exécution automatique toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permet aussi un déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du scraper d'offres ivoiriennes
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_META_ACCESS_TOKEN: ${{ secrets.WHATSAPP_META_ACCESS_TOKEN }}
          WHATSAPP_META_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_META_PHONE_NUMBER_ID }}
          WHATSAPP_META_TO: ${{ secrets.WHATSAPP_META_TO }}
        run: |
          python scraper.py --max-per-site 15 --sites jobberman,emploici
